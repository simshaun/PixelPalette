name: .NET Core

# Trigger on any push with a git tag
# To create a git tag, run the following commands on the branch you wish to release:
#   git tag 1.0.0.0
#   git push origin --tags
on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: windows-latest

    env:
      Portable_Archive: PixelPalette_Portable.zip
      Project_Directory: PixelPalette
      Project_File: PixelPalette\PixelPalette.csproj
      Test_Project_File: PixelPalette.Tests\PixelPalette.Tests.csproj
      Installer_Directory: PixelPalette.Installer
      Installer_Project_File: PixelPalette.Installer\PixelPalette.Installer.wixproj
      Installer_Filename: PixelPalette.Installer.msi

    steps:
      - uses: actions/checkout@v3

      - name: Add dotnet to PATH
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore app deps
        run: dotnet restore $env:Test_Project_File

      - name: Restore installer deps
        run: dotnet restore $env:Installer_Project_File

      # Builds the main App & Test projects.
      - name: Build
        run: dotnet build $env:Test_Project_File --no-restore --configuration Release

      - name: Test
        run: dotnet test $env:Test_Project_File --no-build --no-restore --configuration Release

      - name: Publish
        run: dotnet publish $env:Project_File --no-restore --configuration Release

      - name: Build installer
        run: dotnet build $env:Installer_Project_File --no-restore --configuration Release

      # Archive the App build
      - name: Create App archive
        run: Compress-Archive -Path $env:Project_Directory\bin\Release\win-x64\publish\* -DestinationPath $env:Project_Directory\bin\$env:Portable_Archive

      # Get the name of the tag that was pushed
      - name: Get the version
        id: get_version
        run: echo ::set-output name=VERSION::${GITHUB_REF/refs\/tags\//}
        shell: bash
        
      # Create the release:  https://github.com/actions/create-release
      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions; you do not need to create your own token
        with:
          tag_name: build-release.${{ github.ref }}
          name: ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            ${{ env.Installer_Directory }}/bin/Release/en-us/${{ env.Installer_Filename }}
            ${{ env.Project_Directory }}/bin/${{ env.Portable_Archive }}  
